[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-monte-carlo"
version = "0.1.13"
description = "Product Monte Carlo: Expectation Under a Product of Densities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1,<3"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pietro Carlotti" }]
keywords = ["Bayesian inference", "distributed inference", "federated learning", "Monte Carlo", "PyTorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/PietroCarlotti/PMC"
Repository = "https://github.com/PietroCarlotti/PMC"

[tool.setuptools.packages.find]
where = ["src/python"]

